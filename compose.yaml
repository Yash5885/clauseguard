name: clauseguard

services:
  database:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    environment:
      POSTGRES_DB: clauseguard
      POSTGRES_USER: clauseguard
      POSTGRES_PASSWORD: clauseguard
    ports:
      - "5432:5432"
    volumes:
      - clauseguard_postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauseguard -d clauseguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      CLIENT_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://clauseguard:clauseguard@database:5432/clauseguard
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_SEGMENTATION_MODEL: ${GEMINI_SEGMENTATION_MODEL:-gemini-3.5-flash}
      GEMINI_EXPLANATION_MODEL: ${GEMINI_EXPLANATION_MODEL:-gemini-3.5-flash}
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  clauseguard_postgres_data:
